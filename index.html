<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>플로겟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><span class="logo-mark">🌊</span><span>플로겟</span><button id="logoutButton" class="logout-button hidden" type="button">로그아웃</button></header>
    <section class="hero">
      <p class="eyebrow">BEACH CLEANUP COMMUNITY</p>
      <div class="volunteer-calendar" aria-label="봉사 활동 달력">
        <div class="calendar-heading"><strong id="calendarMonth"></strong><span>초록색은 봉사 완료일</span></div>
        <div class="calendar-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="calendar-days" id="calendarDays"></div>
      </div>
    </section>
    <section class="intro"><p>깨끗한 광안리 바다를 위한 선택</p><b>오늘도 플로겟</b></section>
    <section class="menu-grid" aria-label="봉사 활동 메뉴">
      <button class="menu-card join" data-name="봉사참여"><span>🗑</span><b>봉사참여</b><small>해변 정화 활동 신청하기</small><i>→</i></button>
      <button class="menu-card follow" data-name="후속활동"><span>⌁</span><b>후속활동</b><small>수거 기록과 인증하기</small><i>→</i></button>
      <button class="menu-card weather" data-name="기상상황"><span>☀</span><b>기상상황</b><small>광안리 바다 날씨 확인</small><i>→</i></button>
      <button class="menu-card points" data-name="포인트조회"><span>P</span><b>포인트조회</b><small>내 포인트를 확인하세요</small><i>→</i></button>
    </section>
    <p class="notice" id="notice" aria-live="polite">로그인 후 봉사 활동을 시작해 보세요.</p>
  </main>
  <section class="start-login" id="startLogin" aria-label="로그인">
    <form id="startLoginForm" class="start-login-card">
      <span>🌊</span><p>PLOGGET</p><h1>반가워요!</h1><strong>플로겟에 로그인해 주세요.</strong>
      <label>아이디<input required name="id" maxlength="20" placeholder="아이디를 입력하세요" /></label>
      <label>비밀번호<input required name="password" type="password" minlength="4" placeholder="비밀번호를 입력하세요" /></label>
      <button type="submit">로그인하고 시작하기</button><button type="button" class="signup-link" id="showSignup">회원가입</button><small id="loginMessage">회원가입한 아이디로 로그인해 주세요.</small>
    </form>
    <form id="signupForm" class="start-login-card hidden">
      <span>🌊</span><p>CREATE ACCOUNT</p><h1>회원가입</h1><strong>플로겟 계정을 만들어 주세요.</strong>
      <label>아이디<input required name="id" maxlength="20" placeholder="영문·숫자 2~20자" /></label>
      <label>비밀번호<input required name="password" type="password" minlength="6" placeholder="6자 이상 입력" /></label>
      <label>비밀번호 확인<input required name="confirm" type="password" minlength="6" placeholder="비밀번호를 다시 입력하세요" /></label>
      <button type="submit">회원가입 완료</button><button type="button" class="signup-link" id="showLogin">로그인으로 돌아가기</button><small id="signupMessage">아이디는 대소문자와 앞뒤 공백을 구분하지 않습니다.</small>
    </form>
  </section>
  <section class="modal" id="activityModal" aria-hidden="true"><article class="modal-card"><button class="close" aria-label="닫기">×</button><span id="modalIcon" class="modal-icon">🗑</span><p class="eyebrow" id="modalLabel">BEACH VOLUNTEER</p><h2 id="modalTitle">봉사참여</h2><p id="modalDescription"></p><div id="modalInfo" class="modal-info"></div><div id="modalActions"></div></article></section>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script type="module" src="app.js?v=20260731-cancel-by-status"></script>
</body>
</html>
